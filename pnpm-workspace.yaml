allowBuilds:
  sharp: true
  unrs-resolver: true
overrides:
  # Ranges, not exact pins. An override is meant to be a floor, and an exact pin
  # quietly turns it into a ceiling that holds a package back long after the
  # advisory it was added for is fixed. vite below is already in that state.
  form-data: ^4.0.6
  lodash: ">=4.18.1"
  postcss: ^8.5.16
  vite: 8.0.16

  # ws reaches the tree only through jsdom and vitest, so this is test-time
  # only and has no runtime API surface to break.
  ws: ">=8.21.0"

  # sharp arrives only as next's optional image-optimization dependency, and
  # this app is output: "export", so there is no server to run that pipeline
  # and no reachable call into libvips. The advisory is still worth clearing
  # rather than carrying: < 0.35.0 inherits CVE-2026-33327/33328/35573.
  # next@15 declares ^0.34.3 and only next@16.3 moved to ^0.35.3, so this lifts
  # past next's declared range deliberately. Safe here precisely because the
  # dependency is unused at runtime; revisit if image optimization is ever
  # enabled, and drop this line once the project is on next >= 16.3.
  sharp: ">=0.35.3"

  # brace-expansion is scoped to one path on purpose. The tree carries two
  # copies: 1.1.15 under minimatch@3, which is the vulnerable one, and 5.0.7
  # under minimatch@10, which is already fixed. An unscoped range collapses both
  # onto 5.x, which forces a major on a consumer that asks for ^1.1.7. The fix
  # exists inside 1.x, so lift only the copy that needs lifting.
  minimatch@3>brace-expansion: ">=1.1.16 <2"
