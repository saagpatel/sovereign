name: Test (Node)
on:
  push:
    # Every branch shape scripts/git/guard-branch.sh accepts. Previously this
    # watched only main and feat/**, so a branch named fix/... or chore/... got
    # no CI on push at all, which is indistinguishable from CI passing.
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'refactor/**', 'codex/**', 'cc/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      - run: pnpm test
      # The default branch was unbuildable for a month without anything
      # noticing, because nothing here ran the build. Typecheck and tests both
      # passed throughout: neither one compiles the CSS.
      - run: pnpm build
